<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap');

        :root {
            --color-bg-light: rgb(220, 220, 220);
            --color-bg-dark: black;
            --color-header-bg-light: white;
            --color-header-bg-dark: rgb(30, 30, 30);
            --color-toggle-light: black;
            --color-toggle-dark: white;
            --color-bg-button-light:rgb(223, 223, 223);
            --color-bg-button-dark: rgb(62, 62, 62);
            --color-bg-button-hover-dark:rgb(100, 100, 100);
            --color-bg-button-hover-light: rgb(221, 221, 221);

            --color-text-light: black;
            --color-text-dark: white;
            --color-header-text-h1-light: rgb(73, 73, 73);
            --color-header-text-h1-dark: rgb(242, 242, 242);
            
            --font-size-base: 16rem;
            --font-size-lg: 2.5rem;
            --font-size-me: 1.2rem;
            --font-size-sm:0.9rem;
        }

        *,*::before,*::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Noto Sans", sans-serif;
            background-color: var(--color-bg-light);
            color: var(--color-text-light);
        }

        body.dark-mode {
            background-color: var(--color-bg-dark);
            color: var(--color-text-dark);
        }

        header {
            background-color: var(--color-header-bg-light);
            font-size: 14px;
        }

        .header-box {
            max-width: 1200px;
            margin: 0 auto;  
            padding: 1rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body.dark-mode header {
            background-color: var(--color-header-bg-dark);
            color: var(--color-text-dark);
        }

        header h1 {
            font-size: var(--font-size-lg);
            color: var(--color-header-text-h1-light);
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        body.dark-mode header h1 {
            color: var(--color-header-text-h1-dark);
        }

        .header-search {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 1rem;
        }

        #search {
            border: 1px solid rgb(164, 164, 164);
            border-radius: 15px;
            padding: 0.5rem 1rem;
            width: 250px;
        }

        #search:focus {
            outline: none;
            border-color: rgb(82, 82, 82);
        }

        body.dark-mode #search::placeholder {
            color: rgb(188, 188, 188);
        }

        #toggle {
            font-size: 1.6rem;
            background: none;
            border: none;
            color: var(--color-toggle-light);
            cursor: pointer;
        }

        body.dark-mode #toggle {
            color: var(--color-toggle-dark);
        }

        #toggle:hover {
            transform: scale(0.8);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 1rem;
        }

        nav ul button {
            padding: 0.5rem;
            border: none;
            cursor: pointer;
            border-radius: 15px;
            display: flex;
            align-items: center;
            text-align: center;
            gap: 0.5rem;
            font-size: var(--font-size-me);
            background: var(--color-bg-button-light);
        }

        nav ul button:hover {
            background: var(--color-bg-button-hover-dark);
            color: var(--color-text-dark);
        }

        body.dark-mode nav ul button {
            background: var(--color-bg-button-dark);
            color: var(--color-text-dark);
        }

        body.dark-mode nav ul button:hover {
            background: var(--color-bg-button-hover-light);
            color: var(--color-text-light);
        }
        

    </style>
</head>

<body>
    <header>
        <div class="header-box">
            <h1><i class="fa-solid fa-code"></i>My Portfolio</h1>
            <div class="header-search">
                <input type="text" placeholder="Search projects..." id="search">
                <button id="toggle"><i class="fa-solid fa-moon"></i></button>
            </div>
            <nav>
                <ul>
                    <li><button class="nav-btn" data-filter="all"><i class="fa-solid fa-table"></i>All</button></li>
                    <li><button class="nav-btn" data-filter="web"><i class="fa-solid fa-laptop-code"></i>Web
                            Design</button></li>
                    <li><button class="nav-btn" data-filter="gra"><i class="fa-solid fa-palette"></i>Graphic
                            Design</button></li>
                    <li><button class="nav-btn" data-filter="pho"><i class="fa-solid fa-camera"></i>Photography</button>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main>

    </main>
    <footer>

    </footer>
</body>

</html>

<!--emဆိုparentနဲ့သက်ဆိုင်ပြီးremဆိုrootနဲ့သက်ဆိုင်-->
